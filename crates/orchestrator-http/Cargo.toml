[package]
name = "orchestrator-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "REST API service for commerce orchestrator (Agent-facing)"

[[bin]]
name = "orchestrator-server"
path = "src/main.rs"

[dependencies]
integration-adapters = { path = "../integration-adapters" }
orchestrator-api = { path = "../orchestrator-api" }
orchestrator-core = { path = "../orchestrator-core" }
orchestrator-runtime = { path = "../orchestrator-runtime" }
provider-contracts = { path = "../provider-contracts" }
provider-mocks = { path = "../provider-mocks" }
orchestrator-observability = { path = "../orchestrator-observability" }
orchestrator-mcp = { path = "../orchestrator-mcp" }
axum = { version = "0.7", features = ["json", "macros", "tokio"] }
tower-http = { version = "0.5", features = ["trace"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
url = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
utoipa = "5"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
base64 = "0.23.1"
sha2 = "0.11"
provider-mocks = { path = "../provider-mocks" }
async-trait = "0.1"
axum-test = "16"
jsonschema = { version = "0.63", default-features = false }
http = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
