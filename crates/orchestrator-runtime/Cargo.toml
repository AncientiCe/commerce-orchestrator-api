[package]
name = "orchestrator-runtime"
version.workspace = true
edition.workspace = true
description = "Durable execution runner, idempotency, retries, and timeout handling"

[dependencies]
orchestrator-core = { path = "../orchestrator-core" }
provider-contracts = { path = "../provider-contracts" }
orchestrator-observability = { path = "../orchestrator-observability" }
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "rt"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
# `_rt-tokio` is what binds sqlx's pool to the Tokio runtime. Without it every
# `PgPool` connect panics with "either the `runtime-async-std` or `runtime-tokio`
# feature must be enabled" — i.e. the entire Postgres backend is unreachable.
# It is an internal (underscore) feature because sqlx expects you to depend on the
# `sqlx` facade; this crate depends on sqlx-core/sqlx-postgres directly, so it has
# to be requested here.
sqlx-core = { version = "0.8", default-features = false, features = [
    "json",
    "_rt-tokio",
] }
sqlx-postgres = { version = "0.8" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
provider-mocks = { path = "../provider-mocks" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[lints]
workspace = true
