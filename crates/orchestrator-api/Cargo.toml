[package]
name = "orchestrator-api"
version.workspace = true
edition.workspace = true
description = "Minimal API surface for app/agent integration"

[dependencies]
orchestrator-core = { path = "../orchestrator-core" }
orchestrator-runtime = { path = "../orchestrator-runtime" }
provider-contracts = { path = "../provider-contracts" }
orchestrator-observability = { path = "../orchestrator-observability" }
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
jsonwebtoken = "9"
tokio = { version = "1", features = ["sync", "rt"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "pkcs8", "pem"] }
base64 = "0.23.1"
sha2 = "0.10"
hmac = "0.12"

[dev-dependencies]
provider-mocks = { path = "../provider-mocks" }
rand_core = "0.10.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
