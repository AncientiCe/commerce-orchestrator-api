# ConfigMap: non-sensitive runtime config (component API URLs, server).
# Override values per environment; credentials and keys go in secret.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestrator-api
  labels:
    app: orchestrator-api
data:
  ENV: "production"
  BIND_ADDR: "0.0.0.0:8080"
  RUST_LOG: "info"
  PUBLIC_BASE_URL: "https://orchestrator.example.com"
  # Downstream component API base URLs (no trailing slash). Replace with your service URLs.
  CATALOG_BASE_URL: "http://catalog-service:8080"
  PRICING_BASE_URL: "http://pricing-service:8080"
  TAX_BASE_URL: "http://tax-service:8080"
  GEO_BASE_URL: "http://geo-service:8080"
  PAYMENT_BASE_URL: "http://payment-service:8080"
  RECEIPT_BASE_URL: "http://receipt-service:8080"
  # Optional providers. Leave unset to keep the capability unadvertised and the
  # endpoint returning 501 NOT_CONFIGURED rather than faking a result.
  # FULFILLMENT_BASE_URL: "http://fulfillment-service:8080"
  # PAYMENT_DELEGATION_BASE_URL: "http://psp-delegation:8080"
  # IDENTITY_LINK_BASE_URL: "http://identity-service:8080"
  # Outbox processor: poll interval, batch size, and shutdown drain budget.
  OUTBOX_INTERVAL_MS: "1000"
  OUTBOX_BATCH_SIZE: "50"
  OUTBOX_MAX_ATTEMPTS: "8"
  OUTBOX_DRAIN_TIMEOUT_SECS: "30"
