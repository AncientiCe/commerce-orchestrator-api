# Secret template for sensitive values. Create the secret with:
#   kubectl create secret generic orchestrator-api-secret \
#     --from-literal=DATABASE_URL='postgres://user:pass@postgres:5432/orchestrator' \
#     --from-literal=AUTH_BEARER_TOKEN='your-token' \
#     --from-literal=UCP_SIGNING_KEY_ID='orch-2026-a' \
#     --from-literal=UCP_SIGNING_KEY="$(openssl rand 32 | basenc --base64url | tr -d '=')"
# Or apply after replacing the placeholders below.
apiVersion: v1
kind: Secret
metadata:
  name: orchestrator-api-secret
  labels:
    app: orchestrator-api
type: Opaque
stringData:
  # Required in production: durable state lives here, not on disk.
  DATABASE_URL: "postgres://orchestrator:CHANGE-ME@postgres:5432/orchestrator"
  # Required in production. Replace with your API auth token.
  AUTH_BEARER_TOKEN: "CHANGE-ME"
  AUTH_TENANT_ID: "prod"
  AUTH_CALLER_ID: "prod"
  # Required in production since v0.9.0: the server refuses to start without
  # real Ed25519 key material and will not advertise a key it cannot sign with.
  # UCP_SIGNING_KEY is a 32-byte seed, base64url, unpadded.
  UCP_SIGNING_KEY_ID: "orch-2026-a"
  UCP_SIGNING_KEY: "CHANGE-ME"
  # Optional: retired keys kept verifiable during rotation, as kid:seed pairs.
  # UCP_SIGNING_PREVIOUS_KEYS: "orch-2025-b:<seed>"
  # Optional: agent public keys (kid:x) whose inbound signatures are verified.
  # UCP_AGENT_KEYS: "agent-1:<base64url-public-key>"
